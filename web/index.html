<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay — Local QA Harness</title>
<style>body{font:16px system-ui;background:#f5f5f2;color:#202622;margin:0}main{max-width:1000px;margin:45px auto;padding:24px}h1{font-size:40px}small{color:#657069}section{background:white;border:1px solid #ddd;border-radius:16px;padding:22px;margin:18px 0}input{padding:14px;width:65%;border:1px solid #aaa;border-radius:8px}button{padding:14px;border:0;border-radius:8px;background:#c75229;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#98401e;margin-right:12px}.run{padding:18px 0;border-bottom:1px solid #ddd}li{margin:8px 0}</style>
<main><small>RELAY / LOCAL DEVELOPMENT</small><h1>Let’s check it together.</h1><p>Run your configured suites and inspect the evidence.</p><section><b>Projects</b><ul id="projects"></ul></section><section><b>QA conversation</b><p>Explicit commands · No AI model connected</p><pre id="chat">Try: run robot-api smoke</pre><form id="form"><label for="message">Command</label><br><input id="message" required maxlength="1000" value="run robot-api smoke"><button>Send</button></form></section><section><b>Test runs</b><div id="runs"></div></section></main>
<script>
const el=id=>document.getElementById(id);
async function api(path,options){const r=await fetch(path,options);const data=await r.json();if(!r.ok)throw Error(data.detail||r.statusText);return data;}
function text(tag,value,parent){const node=document.createElement(tag);node.textContent=value;parent.append(node);return node;}
async function refresh(){try{const runs=await api('/api/runs');el('runs').replaceChildren();for(const run of runs){const row=text('div','',el('runs'));row.className='run';text('b',`${run.project} / ${run.suite} — ${run.status}`,row);text('p',run.id,row);if(run.error)text('pre',run.error,row);for(const t of run.tests){text('p',`${t.status.toUpperCase()}: ${t.name}`,row);if(t.message)text('pre',t.message,row);}for(const name of ['console.log',...(run.tests.length?[run.tests[0].evidence]:[])]){const a=text('a',name,row);a.href=`/api/runs/${run.id}/evidence/${name}`;}if(['queued','running'].includes(run.status)){const b=text('button','Cancel',row);b.onclick=async()=>{try{await api(`/api/runs/${run.id}/cancel`,{method:'POST'});await refresh();}catch(e){el('chat').textContent=e.message;}};}}}catch(e){el('chat').textContent=e.message;}}
el('form').onsubmit=async e=>{e.preventDefault();try{const value=el('message').value;const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:value})});el('chat').textContent+=`\nYou: ${value}\nRelay: ${r.message}`;await refresh();}catch(e){el('chat').textContent+=`\nRelay: ${e.message}`;}};
api('/api/projects').then(ps=>ps.forEach(p=>text('li',`${p.id} · ${p.adapter} · ${p.enabled?'enabled':'not configured'} · ${p.suites.join(', ')}`,el('projects')))).catch(e=>el('chat').textContent=e.message);refresh();setInterval(refresh,2000);
</script></html>
