[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-qa-harness"
version = "0.1.0"
description = "Local QA harness for Robot Framework and Playwright"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7.1,<1", "httpx>=0.27,<1", "PyYAML>=6,<7", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "robotframework>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
